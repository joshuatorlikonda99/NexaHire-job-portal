name: NexaHire CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexahire-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-checks:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build

  deploy-preview:
    name: Deploy Vercel preview
    if: github.event_name == 'pull_request'
    needs:
      - quality-checks

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview configuration
        run: >
          vercel pull
          --yes
          --environment=preview
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build preview deployment
        run: >
          vercel build
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: preview
        shell: bash
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }})

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Vercel preview deployment"
            echo ""
            echo "Preview URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality-checks

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: ${{ steps.production.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: >
          vercel pull
          --yes
          --environment=production
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production deployment
        run: >
          vercel build
          --prod
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: production
        shell: bash
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }})

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Vercel production deployment"
            echo ""
            echo "Production URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"